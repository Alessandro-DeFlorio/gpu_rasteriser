[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "tetvox"
dynamic = ["version"]
description = "Fast, watertight, differentiable CUDA voxeliser for tetrahedral meshes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
torch = ["torch>=2.4"]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "clang-format>=18"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}/{state}"  # editable vs wheel builds never share a cache
editable.rebuild = true
editable.verbose = false
wheel.packages = ["src/tetvox"]
cmake.build-type = "Release"
install.components = ["python"]  # the wheel gets the extension only, not the C++ package (ADR 0004)

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(tetvox VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
# "native" builds for the GPU(s) in this machine. Override for portable builds, e.g.
#   pip install . -Ccmake.define.CMAKE_CUDA_ARCHITECTURES="75;86;89;120"
CMAKE_CUDA_ARCHITECTURES = "native"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/tetvox/_core.pyi", "docs"]  # generated stub; sketches in docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
